
name: Build MD Animation Studio Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q MD-Animation-Studio-Native-MP4-Source.zip -d /tmp/md-source
          cp -a /tmp/md-source/MD-Animation-Studio-Native-MP4/. .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Install native MP4 and TTS engine
        run: |
          mkdir -p android/app/src/main/java/com/md/animationstudio
          cp android-native/src/main/java/com/md/animationstudio/NativeMovieExporterPlugin.java android/app/src/main/java/com/md/animationstudio/
          cp android-native/src/main/java/com/md/animationstudio/MainActivity.java android/app/src/main/java/com/md/animationstudio/

          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />'
          if permission not in text:
              pos = text.find(">", text.find("<manifest")) + 1
              text = text[:pos] + "\n    " + permission + text[pos:]
              manifest.write_text(text)
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MD-Animation-Studio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
